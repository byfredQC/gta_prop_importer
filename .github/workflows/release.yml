name: Release

on:
  push:
    tags: ['v*']        # git tag v1.3.0 && git push origin v1.3.0  ->  GitHub Release with the add-on zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the add-on (extension files at the zip root, Blender 4.2+ "Install from Disk")
        working-directory: gta_prop_importer
        run: zip -r ../gta_prop_importer.zip . -x '__pycache__/*' '*/__pycache__/*' '*.pyc'
      - uses: actions/upload-artifact@v4
        with:
          name: gta_prop_importer
          path: gta_prop_importer.zip
      - name: Publish the Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gta_prop_importer.zip
          generate_release_notes: true

      - name: Announce on Discord
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}   # repo Settings > Secrets and variables > Actions
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "No DISCORD_WEBHOOK secret - skipped"; exit 0; fi
          NOTES=$(gh release view "$TAG" --repo "$REPO" --json body -q .body 2>/dev/null | head -c 1500)
          URL="https://github.com/$REPO/releases/tag/$TAG"
          ZIP="https://github.com/$REPO/releases/download/$TAG/gta_prop_importer.zip"
          jq -n --arg tag "$TAG" --arg url "$URL" --arg zip "$ZIP" --arg notes "$NOTES" '{
            username: "GTA Prop Importer",
            embeds: [{
              title: ("GTA Prop Importer " + $tag + " est sorti !"),
              url: $url,
              color: 5793266,
              description: ((if $notes == "" then "" else $notes + "\n\n" end) + "⬇️ **[Télécharger le zip](" + $zip + ")** - Blender › Preferences › Get Extensions › Install from Disk")
            }]
          }' > payload.json
          curl -sS -f -H "Content-Type: application/json" -d @payload.json "$DISCORD_WEBHOOK"
